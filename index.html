<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Trainer</title>
    <style>
        /* --- Import Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Nunito:wght@400;600&display=swap');

        /* --- CSS Variables based on Design Brief --- */
        :root {
            --primary-300: #F9C97A;
            --primary-500: #F4A329;
            --primary-700: #B45309;
            --secondary-300: #7EDAD6;
            --secondary-500: #2BB6B4;
            --secondary-700: #0F766E;
            --accent-300: #F49DB8;
            --accent-500: #E8467B;
            --accent-700: #A61E4D;
            --bg: #FFF7F2;
            --surface: #FFFFFF;
            --surface-alt: #F5F7FA;
            --border: #E6E9EF;
            --text: #1F2937;
            --text-2: #4B5563;
            --text-muted: #6B7280;
            --text-inverse: #FFFFFF;
            --success: #2F9E44;
            --warning: #F59F00;
            --error: #D92D20;
            --info: #2563EB;

            --font-main: "Inter", "Nunito", system-ui, sans-serif;
            --sp-2: 4px;
            --sp-4: 8px;
            --sp-6: 12px;
            --sp-8: 16px;
            --sp-12: 24px;
            --radius: 16px;
            --radius-pill: 9999px;
            --shadow-card: 0 4px 14px rgba(17, 24, 39, 0.08);
            --transition: 180ms ease;
        }

        /* --- Base Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
        }
        h1, h2, h3 { font-weight: 600; color: var(--text); line-height: 1.3; }
        h1 { font-size: 32px; }
        h2 { font-size: 24px; margin-bottom: var(--sp-8); }
        p { color: var(--text-2); margin-bottom: var(--sp-6); }

        /* --- Layout --- */
        .container { max-width: 800px; margin: 0 auto; padding: var(--sp-8); }
        
        /* --- Components --- */
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: var(--sp-12);
            margin-bottom: var(--sp-8);
        }

        button {
            font-family: var(--font-main);
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            padding: var(--sp-6) var(--sp-12);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-primary {
            background-color: var(--primary-700);
            color: var(--text-inverse);
            border: 2px solid var(--primary-700);
        }
        .btn-primary:not(:disabled):hover { filter: brightness(95%); }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--primary-700);
            border: 2px solid var(--primary-300);
        }
        .btn-secondary:not(:disabled):hover {
            background-color: rgba(249, 201, 122, 0.24);
        }

        input[type="text"] {
            width: 100%;
            padding: var(--sp-6);
            font-family: var(--font-main);
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: var(--sp-4);
            margin-bottom: var(--sp-4);
        }
        input[type="text"]:focus {
            outline: 2px solid var(--secondary-500);
            border-color: var(--secondary-500);
        }

        .hidden { display: none !important; }

        /* --- App Specific --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-8);
            flex-wrap: wrap;
            gap: var(--sp-4);
        }
        .stats-bar {
            display: flex;
            gap: var(--sp-12);
            background: var(--surface);
            padding: var(--sp-4) var(--sp-8);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-card);
        }
        .stat { font-weight: 600; }
        .stat-score { color: var(--success); }

        .nav-buttons {
            display: flex;
            gap: var(--sp-4);
            margin-bottom: var(--sp-8);
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Flashcards */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin-bottom: var(--sp-8);
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--surface);
            border: 2px solid var(--primary-300);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: var(--sp-8);
            text-align: center;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: var(--surface-alt);
        }
        .word-large { font-size: 32px; font-weight: 600; color: var(--primary-700); margin-bottom: var(--sp-4); }
        .word-translation { font-size: 24px; color: var(--secondary-700); margin-bottom: var(--sp-4); }
        .word-example { font-size: 16px; font-style: italic; color: var(--text-2); }
        
        .controls { display: flex; justify-content: center; gap: var(--sp-4); margin-top: var(--sp-8); flex-wrap: wrap;}

        /* Multiple Choice */
        .mc-options { display: flex; flex-direction: column; gap: var(--sp-4); margin-top: var(--sp-8); }
        .mc-option { 
            padding: var(--sp-6); 
            border: 1px solid var(--border); 
            border-radius: var(--sp-4); 
            cursor: pointer; 
            transition: var(--transition);
            background: var(--surface);
        }
        .mc-option:hover { background: var(--surface-alt); border-color: var(--secondary-300); }
        .mc-option.correct { background: var(--success); color: white; border-color: var(--success); }
        .mc-option.incorrect { background: var(--error); color: white; border-color: var(--error); }

        /* General Feedback */
        .feedback { font-weight: 600; margin-top: var(--sp-4); text-align: center; min-height: 24px;}
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: var(--radius-pill);
            margin-bottom: var(--sp-8);
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--secondary-500);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Vocab Master</h1>
        <div class="stats-bar">
            <div class="stat">Word: <span id="word-counter">1/0</span></div>
            <div class="stat stat-score">Score: <span id="score-counter">0</span></div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="nav-buttons">
        <button class="btn-secondary" onclick="switchMode('study')">1. Study Cards</button>
        <button class="btn-secondary" onclick="switchMode('practice')">2. Practice</button>
        <button class="btn-secondary" onclick="switchMode('activate')">3. Activate</button>
        <button class="btn-secondary" onclick="switchMode('dictation')">4. Dictation</button>
    </div>

    <!-- 1. Study Cards -->
    <div id="mode-study" class="mode-section card">
        <h2>Study Cards</h2>
        <div style="text-align: right; margin-bottom: 8px;">
            <button class="btn-secondary" style="padding: 4px 12px; font-size: 14px;" onclick="toggleLanguageDirection()">Swap EN/HU</button>
        </div>
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="word-large" id="card-front-text">Word</div>
                    <button class="btn-secondary" style="margin-top: 16px; padding: 4px 8px;" onclick="event.stopPropagation(); playAudio(currentWord.word)">🔊 Listen</button>
                </div>
                <div class="card-face card-back">
                    <div class="word-translation" id="card-back-text">Translation</div>
                    <div class="word-example" id="card-example">Example sentence</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="btn-primary" onclick="nextWord()">Next Word</button>
        </div>
    </div>

    <!-- 2. Practice (Multiple Choice) -->
    <div id="mode-practice" class="mode-section card hidden">
        <h2>Practice</h2>
        <p>Choose the correct word to complete the sentence.</p>
        <div id="mc-sentence" class="word-example" style="font-size: 18px; margin: 24px 0;"></div>
        <div class="mc-options" id="mc-options">
            <!-- Options generated here -->
        </div>
        <div id="mc-feedback" class="feedback"></div>
        <div class="controls">
            <button class="btn-primary" onclick="nextWord()">Next Word</button>
        </div>
    </div>

    <!-- 3. Activate (Gap-fill) -->
    <div id="mode-activate" class="mode-section card hidden">
        <h2>Activate</h2>
        <p>Type the missing word exactly as it appears in English. Case sensitive!</p>
        <div id="act-sentence" class="word-example" style="font-size: 18px; margin: 24px 0;"></div>
        <input type="text" id="act-input" placeholder="Type the word here...">
        
        <div id="act-feedback" class="feedback"></div>
        
        <div class="controls">
            <button class="btn-secondary" id="act-hint-btn" onclick="showHint('act')">Hint</button>
            <button class="btn-secondary" onclick="showAnswer('act')">Show Answer</button>
            <button class="btn-primary" onclick="checkActivate()">Check</button>
            <button class="btn-primary" onclick="nextWord()">Next Word</button>
        </div>
        <div id="act-hint-display" class="word-translation hidden" style="text-align: center; margin-top: 16px;"></div>
    </div>

    <!-- 4. Dictation -->
    <div id="mode-dictation" class="mode-section card hidden">
        <h2>Dictation</h2>
        <p>Listen and type the word exactly. Case sensitive!</p>
        
        <div style="text-align: center; margin: 24px 0;">
            <button class="btn-secondary" onclick="playAudio(currentWord.word)" style="font-size: 24px; padding: 12px 24px;">🔊 Play Audio</button>
        </div>
        
        <input type="text" id="dic-input" placeholder="Type what you hear...">
        
        <div id="dic-feedback" class="feedback"></div>

        <div class="controls">
             <button class="btn-secondary" id="dic-hint-btn" onclick="showHint('dic')">Hint</button>
             <button class="btn-secondary" onclick="showAnswer('dic')">Show Answer</button>
            <button class="btn-primary" onclick="checkDictation()">Check</button>
            <button class="btn-primary" onclick="nextWord()">Next Word</button>
        </div>
        <div id="dic-hint-display" class="word-translation hidden" style="text-align: center; margin-top: 16px;"></div>
    </div>

</div>

<script>
    let vocabData = [];
    let currentIndex = 0;
    let score = 0;
    let currentMode = 'study';
    let currentWord = null;
    let usedHint = false;
    let langDirection = 'EN-HU'; // 'EN-HU' or 'HU-EN'

    // DOM Elements
    const wordCounterEl = document.getElementById('word-counter');
    const scoreCounterEl = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    const sections = document.querySelectorAll('.mode-section');

    // Fetch data
    async function loadData() {
        try {
            const response = await fetch('vocab_database.json');
            vocabData = await response.json();
            // Shuffle initial data for random progression
            shuffleArray(vocabData);
            updateUI();
        } catch (error) {
            console.error("Error loading database:", error);
            // Fallback for local testing if fetch fails due to CORS
            document.body.innerHTML = "<div class='container'><div class='card'><h2>Error</h2><p>Could not load vocab_database.json. Please ensure it is in the same directory and you are running a local server.</p></div></div>";
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        sections.forEach(sec => sec.classList.add('hidden'));
        document.getElementById(`mode-${mode}`).classList.remove('hidden');
        setupCurrentMode();
    }

    function nextWord() {
        currentIndex++;
        if (currentIndex >= vocabData.length) {
            currentIndex = 0;
            shuffleArray(vocabData); // reshuffle for next round
        }
        updateUI();
    }

    function updateUI() {
        if(vocabData.length === 0) return;
        
        currentWord = vocabData[currentIndex];
        usedHint = false;
        
        wordCounterEl.textContent = `${currentIndex + 1}/${vocabData.length}`;
        scoreCounterEl.textContent = score;
        progressBar.style.width = `${((currentIndex) / vocabData.length) * 100}%`;

        setupCurrentMode();
    }

    function setupCurrentMode() {
        if(!currentWord) return;
        
        // Reset hints & feedback
        document.getElementById('act-hint-display').classList.add('hidden');
        document.getElementById('dic-hint-display').classList.add('hidden');
        document.getElementById('act-feedback').textContent = '';
        document.getElementById('dic-feedback').textContent = '';
        document.getElementById('mc-feedback').textContent = '';
        document.getElementById('act-input').value = '';
        document.getElementById('dic-input').value = '';

        if (currentMode === 'study') {
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.remove('is-flipped');
            
            const frontEl = document.getElementById('card-front-text');
            const backEl = document.getElementById('card-back-text');
            const exEl = document.getElementById('card-example');

            if(langDirection === 'EN-HU') {
                frontEl.textContent = currentWord.word;
                backEl.textContent = currentWord.translation;
                exEl.textContent = currentWord.example;
            } else {
                frontEl.textContent = currentWord.translation;
                backEl.textContent = currentWord.word;
                exEl.textContent = ""; // Hide example on reverse to not give away English word
            }

        } else if (currentMode === 'practice') {
            // Setup MC
            const sentenceEl = document.getElementById('mc-sentence');
            const regex = new RegExp(`\\b${escapeRegExp(currentWord.word)}\\b`, 'gi');
            let blanked = currentWord.example.replace(regex, "_________");
            
            // Fallback if word not exactly in sentence
            if(blanked === currentWord.example) {
                 blanked = currentWord.example + ` (Target: ${currentWord.translation})`;
            }

            sentenceEl.textContent = blanked;

            // Generate options
            const optionsEl = document.getElementById('mc-options');
            optionsEl.innerHTML = '';
            
            let options = [currentWord];
            let attempts = 0;
            while(options.length < 4 && attempts < 50) {
                let randomItem = vocabData[Math.floor(Math.random() * vocabData.length)];
                if(!options.find(o => o.word === randomItem.word)) {
                    options.push(randomItem);
                }
                attempts++;
            }
            shuffleArray(options);

            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'mc-option';
                div.textContent = opt.word;
                div.onclick = () => checkMC(div, opt.word);
                optionsEl.appendChild(div);
            });

        } else if (currentMode === 'activate') {
            const sentenceEl = document.getElementById('act-sentence');
            const regex = new RegExp(`\\b${escapeRegExp(currentWord.word)}\\b`, 'gi');
            let blanked = currentWord.example.replace(regex, "_________");
            if(blanked === currentWord.example) {
                 blanked = currentWord.example + ` (Target missing)`;
            }
            sentenceEl.textContent = blanked;
            
        } else if (currentMode === 'dictation') {
            // Just waits for input
        }
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\]/g, '\\$&');
    }

    function toggleLanguageDirection() {
        langDirection = langDirection === 'EN-HU' ? 'HU-EN' : 'EN-HU';
        setupCurrentMode();
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text to speech!");
        }
    }

    function showHint(prefix) {
        usedHint = true;
        const display = document.getElementById(`${prefix}-hint-display`);
        display.textContent = `Hungarian translation: ${currentWord.translation}`;
        display.classList.remove('hidden');
    }

    function showAnswer(prefix) {
        usedHint = true;
        const display = document.getElementById(`${prefix}-hint-display`);
        display.textContent = `Answer: ${currentWord.word}`;
        display.classList.remove('hidden');
    }

    function checkMC(element, selectedWord) {
        const feedback = document.getElementById('mc-feedback');
        if(element.classList.contains('correct') || element.classList.contains('incorrect')) return;

        if (selectedWord === currentWord.word) {
            element.classList.add('correct');
            feedback.textContent = "Correct!";
            feedback.className = "feedback success";
            addScore();
        } else {
            element.classList.add('incorrect');
            feedback.textContent = `Incorrect. The answer is: ${currentWord.word}`;
            feedback.className = "feedback error";
            usedHint = true;
        }
    }

    function checkActivate() {
        const input = document.getElementById('act-input').value.trim();
        const feedback = document.getElementById('act-feedback');
        
        if (input === currentWord.word) {
            feedback.textContent = "Correct!";
            feedback.className = "feedback success";
            addScore();
        } else {
            feedback.textContent = "Incorrect. Try again or use a hint.";
            feedback.className = "feedback error";
        }
    }

    function checkDictation() {
        const input = document.getElementById('dic-input').value.trim();
        const feedback = document.getElementById('dic-feedback');
        
        if (input === currentWord.word) {
            feedback.textContent = "Correct!";
            feedback.className = "feedback success";
            addScore();
        } else {
            feedback.textContent = "Incorrect. Try again or use a hint.";
            feedback.className = "feedback error";
        }
    }

    function addScore() {
        if (!usedHint) {
            score++;
            scoreCounterEl.textContent = score;
            usedHint = true;
        }
    }

    loadData();

</script>
</body>
</html>
